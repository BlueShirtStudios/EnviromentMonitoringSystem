<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Auto-refreshes page every 2 seconds -->
    <meta http-equiv="refresh" content="2">
    <title>Pico Stats</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container" style="max-width: 500px; margin-top: 50px; text-align: center;">
        <h2>🍓 Pico Live Stats</h2>
        
        <article>
            <h1 style="color: #0d6efd;">{{ stats.temperature }} °C</h1>
            <p><strong>Status:</strong> {{ stats.status }}</p>
        </article>
    </main>
</body>
</html>
